
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuralDoc RAG Engine</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="dashboard">
        <!-- Sidebar for file ingestion -->
        <aside class="sidebar">
            <div class="brand">
                <h2>🧠 NeuralDoc</h2>
                <p>Knowledge Retrieval API</p>
            </div>
            
            <div class="upload-panel">
                <h3>Document Vault</h3>
                <form id="uploadForm">
                    <label for="fileInput" class="drop-zone">
                        <span id="fileName">Click to select PDF/TXT</span>
                        <input type="file" id="fileInput" accept=".pdf,.txt" required>
                    </label>
                    <button type="submit" id="uploadBtn">Ingest Document</button>
                </form>
                <div id="uploadStatus" class="status-message"></div>
            </div>
        </aside>

        <!-- Main chat interface -->
        <main class="chat-container">
            <header class="chat-header">
                <h2>Contextual Analysis Engine</h2>
            </header>
            
            <div class="chat-history" id="chatHistory">
                <div class="chat-bubble system">
                    System Ready: Upload a document in the vault, then ask questions below.
                </div>
            </div>
            
            <div class="input-panel">
                <form id="askForm">
                    <input type="text" id="questionInput" placeholder="Ask a question based on the document..." required autocomplete="off">
                    <button type="submit" id="askBtn">Analyze</button>
                </form>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
